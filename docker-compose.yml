services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/qa-platform.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - qa-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  qa-data:
